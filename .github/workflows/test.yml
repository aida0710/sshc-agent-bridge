name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Test hook reporter and manifests
        run: python -m unittest discover -s tests -v
      - name: Test OpenCode adapter
        working-directory: opencode
        run: npm test
